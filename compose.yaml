services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      TRIPOSR_API_URL: http://triposr-api:8001
      TRIPOSR_API_TIMEOUT_SECONDS: 60
      STORAGE_ROOT: /app/storage
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      triposr-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); assert r.status == 200; r.read()\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  triposr-api:
    build:
      context: .
      dockerfile: services/triposr-api/Dockerfile
      additional_contexts:
        triposr-main: ../TripoSR-main
    environment:
      TRIPOSR_SOURCE_DIR: /opt/triposr
      TRIPOSR_DEVICE: cuda:0
      TRIPOSR_CHUNK_SIZE: 8192
      TRIPOSR_MC_RESOLUTION: 256
      TRIPOSR_MAX_IMAGE_EDGE: 2048
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
