server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 後端允許 10MB；略放大邊界與 multipart 開銷
    client_max_body_size 15m;

    # prefix location /api/ 不會匹配精確路徑 /api；避免落入 SPA try_files
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 與後端 TRIPOSR_API_TIMEOUT_SECONDS（compose.yaml x-triposr-api-timeout-seconds）一致
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # 對外僅最小 JSON（status）；triposr_ok／detail 仍可由直連 backend 之 GET /health 取得（家裡除錯）
    location = /health {
        proxy_pass http://backend:8000/health/public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
